name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  betterleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so PR commit ranges resolve; also fetches all refs for the main sweep
          persist-credentials: false

      # Private extra rules (internal hostnames etc.) can be supplied without
      # ever appearing in this public repo: put the full TOML content in a repo
      # secret named BETTERLEAKS_CONFIG_TOML (betterleaks reads that env var as
      # the config itself). Start it with [extend] useDefault = true.
      #
      # Scan scope: PRs scan only their own commits (mirrors the pre-push
      # hook) so a leak on an unrelated branch can't fail every open PR.
      # Pushes to main scan every ref — the global safety net that catches
      # anything pushed anywhere, including branches with no PR.
      #
      # Keep console output summary-only. Detailed findings are redacted in
      # the SARIF report and uploaded to restricted Code Scanning alerts.
      - name: Run betterleaks
        env:
          BETTERLEAKS_CONFIG_TOML: ${{ secrets.BETTERLEAKS_CONFIG_TOML }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$BETTERLEAKS_CONFIG_TOML" ] || unset BETTERLEAKS_CONFIG_TOML
          extra_args=()
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            extra_args=(--log-opts="$PR_BASE_SHA..$PR_HEAD_SHA")
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ runner.temp }}:/output" \
            -e BETTERLEAKS_CONFIG_TOML \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/betterleaks/betterleaks:1.7.4@sha256:16f903f0100ce7358ef1f870858777e55bec94cf04c6b65c45d013274ea3311c \
            git /repo \
              --redact=100 \
              --no-banner \
              --report-format sarif \
              --report-path /output/betterleaks.sarif \
              "${extra_args[@]}"

      # The scanner exits non-zero when it finds a leak, so this must run even
      # after failure. Do not upload PR results: Code Scanning annotations on
      # pull requests are visible to anyone with read access.
      - name: Upload redacted SARIF
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/betterleaks.sarif
          category: betterleaks
