name: "AI Skills Dispatcher"
description: "Runs AI agent skills against pull request events using Claude Code, GitHub Copilot, and other AI tools."
author: "ai-agent-manager"
branding:
  icon: "cpu"
  color: "purple"

inputs:
  config-path:
    description: "Path to the ai-skills.yml config file in the consumer repo."
    required: false
    default: ".github/ai-skills.yml"

  bundle-base-url:
    description: "Skill Bundle base URL. Accessible location where skill bundles are hosted (e.g. https://bootstrap.example.com)."
    required: true

  bundle-access-token:
    description: "Bearer token for bundle servers that require authentication (passed to agent-manager as AGENTMAN_ACCESS_TOKEN). Leave empty for unauthenticated servers."
    required: false
    default: ""

  agent-manager-ref:
    description: "npm version tag for @ai-agent-manager/cli (e.g. 0.17.0). Defaults to latest."
    required: false
    default: "latest"

  gateway-base-url:
    description: "AI gateway base URL (e.g. https://gateway.example.com). Used by Claude Code and pi. Prefer this over anthropic-base-url / litellm-base-url."
    required: false
    default: ""

  gateway-api-key:
    description: "Auth hook for the selected harness — gateway API key (Claude Code / pi) or fine-grained GitHub user PAT with Copilot Requests (github-copilot). Prefer this over anthropic-auth-token / litellm-api-key."
    required: false
    default: ""

  default-model:
    description: "Default model ID for Claude Code / pi when skill.model is unset. Prefer this over anthropic-model / pi-model. Overridable per skill via model: in ai-skills.yml."
    required: false
    default: ""

  anthropic-auth-token:
    description: "Deprecated alias for gateway-api-key (Claude Code). Still accepted for backwards compatibility."
    required: false
    default: ""

  anthropic-base-url:
    description: "Deprecated alias for gateway-base-url (Claude Code). Still accepted for backwards compatibility."
    required: false
    default: ""

  anthropic-model:
    description: "Deprecated alias for default-model (Claude Code). Still accepted for backwards compatibility."
    required: false
    default: ""

  github-token:
    description: "GitHub token used to post PR comments / update PR description."
    required: true

  copilot-token:
    description: "Optional Copilot override when mixing a gateway harness with native GitHub Copilot in the same repo. Fine-grained user PAT with Copilot Requests only. If unset, github-copilot uses gateway-api-key."
    required: false
    default: ""

  litellm-base-url:
    description: "Deprecated alias for gateway-base-url (pi). Still accepted for backwards compatibility."
    required: false
    default: ""

  litellm-api-key:
    description: "Deprecated alias for gateway-api-key (pi). Still accepted for backwards compatibility."
    required: false
    default: ""

  pi-model:
    description: "Deprecated alias for default-model (pi). Still accepted for backwards compatibility."
    required: false
    default: ""

runs:
  using: "docker"
  image: "Dockerfile"
  # Docker actions require explicit env mapping (use UNDERSCORES, not hyphens)
  # @actions/core's getInput() converts "bundle-base-url" → INPUT_BUNDLE_BASE_URL
  env:
    INPUT_CONFIG_PATH: ${{ inputs.config-path }}
    INPUT_BUNDLE_BASE_URL: ${{ inputs.bundle-base-url }}
    INPUT_BUNDLE_ACCESS_TOKEN: ${{ inputs.bundle-access-token }}
    INPUT_AGENT_MANAGER_REF: ${{ inputs.agent-manager-ref }}
    INPUT_GATEWAY_BASE_URL: ${{ inputs.gateway-base-url }}
    INPUT_GATEWAY_API_KEY: ${{ inputs.gateway-api-key }}
    INPUT_DEFAULT_MODEL: ${{ inputs.default-model }}
    INPUT_ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic-auth-token }}
    INPUT_ANTHROPIC_BASE_URL: ${{ inputs.anthropic-base-url }}
    INPUT_ANTHROPIC_MODEL: ${{ inputs.anthropic-model }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    INPUT_COPILOT_TOKEN: ${{ inputs.copilot-token }}
    INPUT_LITELLM_BASE_URL: ${{ inputs.litellm-base-url }}
    INPUT_LITELLM_API_KEY: ${{ inputs.litellm-api-key }}
    INPUT_PI_MODEL: ${{ inputs.pi-model }}
